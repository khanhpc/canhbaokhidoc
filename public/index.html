<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="https://img.lovepik.com/png/20231014/Happy-panda-hugging-bamboo-clipart_199023_wh1200.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Web site created using create-react-app" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  <title>Cảnh Báo Khí Độc</title>
</head>

<body>
  <div id="root"></div>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').then(function (registration) {
          console.log('PWA đã độ thành công! Scope: ', registration.scope);
        }, function (err) {
          console.log('Độ PWA thất bại: ', err);
        });
      });
    }
  </script>
</body>

</html>
